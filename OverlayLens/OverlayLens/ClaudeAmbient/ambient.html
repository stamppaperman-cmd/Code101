<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>StampLab Ambient</title>
<style>
:root{--u:min(1vw,1.6vh)}
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;
  font-family:-apple-system,"SF Pro Text","Sukhumvit Set","Thonburi",sans-serif;-webkit-user-select:none;user-select:none}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#clk{position:absolute;top:calc(3.1*var(--u));left:0;right:0;text-align:center;color:#5f5e5a;font-size:calc(2.24*var(--u))}
#hint{position:absolute;bottom:calc(2.8*var(--u));left:0;right:0;text-align:center;color:#444441;font-size:calc(2.07*var(--u))}
#drift{display:flex;flex-direction:column;align-items:center;gap:calc(2.4*var(--u));animation:dr 40s ease-in-out infinite}
#chars{display:flex;align-items:flex-end;gap:calc(5*var(--u))}
#sc,#sg{width:calc(31*var(--u));height:auto}
#t1{color:#e8e6dc;font-size:calc(3.8*var(--u));font-weight:500;text-align:center}
#t2{color:#888780;font-size:calc(2.24*var(--u));margin-top:calc(1*var(--u));text-align:center}
@keyframes dr{0%,100%{transform:translate(calc(-2.4*var(--u)),calc(-1*var(--u)))}50%{transform:translate(calc(2.4*var(--u)),calc(1*var(--u)))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes stroke{0%,100%{transform:translate(0,0) rotate(0)}30%{transform:translate(3px,-7px) rotate(-6deg)}60%{transform:translate(5px,3px) rotate(4deg)}}
@keyframes reveal{0%{transform:scaleY(1)}78%,94%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes blk{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.15)}}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shd{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.75);opacity:.5}}
@keyframes spk{0%,100%{opacity:0}40%{opacity:1}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px)}}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:1}}
#sky{position:absolute;inset:0;pointer-events:none;transition:background 2s}
#sky.day{background:radial-gradient(ellipse at 50% 120%,rgba(55,138,221,.10),transparent 60%)}
#sky.morning{background:radial-gradient(ellipse at 80% 110%,rgba(250,199,117,.13),transparent 55%)}
#sky.dusk{background:linear-gradient(to top,rgba(216,90,48,.30),rgba(153,53,86,.14) 35%,transparent 60%)}
.px{position:absolute;width:calc(.4*var(--u));height:calc(.4*var(--u));background:#e8e6dc;animation:tw 3.2s ease-in-out infinite}
#moon,#sunp{position:absolute;top:calc(6*var(--u));right:calc(9*var(--u));width:calc(5*var(--u));display:none}
.night #moon,.late #moon,.day #sunp,.morning #sunp,.dusk #sunp{display:block}
#shoot{position:absolute;top:calc(8*var(--u));left:20%;width:calc(6*var(--u));height:calc(.3*var(--u));background:linear-gradient(to right,transparent,#e8e6dc);opacity:0}
.night #shoot,.late #shoot{animation:shoot 23s linear infinite}
@keyframes shoot{0%,92%{opacity:0;transform:translate(0,0) rotate(18deg)}94%{opacity:.9}100%{opacity:0;transform:translate(calc(30*var(--u)),calc(10*var(--u))) rotate(18deg)}}
#spot{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 38% 34% at 50% 50%,rgba(255,236,200,.05),transparent 70%)}
#floor{width:calc(70*var(--u));height:1px;background:linear-gradient(to right,transparent,#2C2C2A,transparent);margin-top:calc(-1.2*var(--u))}
.cap,.yawn,.zz{display:none}
.late .cap,.late .yawn,.late .zz{display:inline}
.late .yawn{animation:yawn 9s ease-in-out infinite;transform-origin:center}
@keyframes yawn{0%,70%,92%,100%{opacity:0;transform:scaleY(.2)}76%,86%{opacity:1;transform:scaleY(1)}}
.late .zz{animation:zz 3s ease-out infinite}.late .zz.b{animation-delay:1.5s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-18px)}}
#quota{position:absolute;top:calc(2.6*var(--u));left:calc(3.4*var(--u));display:flex;align-items:center;gap:calc(1*var(--u));color:#888780;font-size:calc(1.55*var(--u));line-height:1.35}
#quota svg{height:calc(2.4*var(--u));width:auto}
#quota b{font-weight:500;color:#c9c7bd}
#acts{margin-top:calc(1.6*var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(.5*var(--u))}
.act{display:flex;align-items:center;gap:calc(.7*var(--u));color:#5f5e5a;font-size:calc(1.6*var(--u))}
.act i{width:calc(.75*var(--u));height:calc(.75*var(--u));display:inline-block}
.act.now{color:#c9c7bd;font-size:calc(1.95*var(--u))}
.act.now.fresh{animation:fresh .6s ease-out}
@keyframes fresh{0%{opacity:0;transform:translateY(calc(1*var(--u)))}100%{opacity:1;transform:none}}
#cnt{color:#5f5e5a;font-size:calc(1.45*var(--u));margin-top:calc(.4*var(--u))}
.sweat{display:none}.hot .sweat{display:inline}
.hot .sweat{animation:drip 1.6s ease-in infinite}.hot .sweat.b{animation-delay:.8s}
@keyframes drip{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
#recap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
  min-width:calc(42*var(--u));padding:calc(3*var(--u)) calc(4*var(--u)) calc(2.4*var(--u));border-radius:calc(2.2*var(--u));
  background:rgba(30,30,28,.94);border:1px solid #3a3a37;color:#e8e6dc;box-shadow:0 calc(2*var(--u)) calc(6*var(--u)) rgba(0,0,0,.6)}
.recap #recap{opacity:1;transform:translate(-50%,-50%) scale(1)}
.recap #drift,.recap #quota{opacity:.15;transition:opacity .35s}
.recap #hint{opacity:0}
#recap h1{margin:0 0 calc(1.8*var(--u));font-size:calc(2.7*var(--u));font-weight:500}
.rr{display:flex;align-items:baseline;gap:calc(1.1*var(--u));font-size:calc(2.1*var(--u));margin:calc(.9*var(--u)) 0}
.rr i{width:calc(1*var(--u));height:calc(1*var(--u));display:inline-block;flex:none;transform:translateY(calc(-.15*var(--u)))}
.rr span{color:#888780;font-size:calc(1.7*var(--u))}
#rfoot{display:flex;gap:calc(2.4*var(--u));margin-top:calc(2.2*var(--u));color:#888780;font-size:calc(1.6*var(--u));align-items:center}
#rfoot kbd{font:inherit;color:#e8e6dc;border:1px solid #5f5e5a;border-radius:calc(.5*var(--u));padding:0 calc(.6*var(--u));margin-right:calc(.5*var(--u))}
#rbar{height:2px;background:#5f5e5a;margin-top:calc(1.6*var(--u));transform-origin:left}
.recap #rbar{animation:rbar 4.5s linear forwards}
@keyframes rbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
svg.ch *{transform-box:fill-box;transform-origin:center}
.cover{transform-origin:bottom !important}
.work .cover{animation:reveal 8s steps(14) infinite}
.wait .cover,.done .cover{display:none}
.work #cB{animation:bob 1.2s ease-in-out infinite}
.work #cR,.work #gR{animation:stroke .9s ease-in-out infinite;transform-origin:left !important}
.work #cE,.work #gE{animation:blk 4s infinite}
.work #gB{animation:flo 2.4s ease-in-out infinite}.work #gS{animation:shd 2.4s ease-in-out infinite}
.work .s1{animation:spk 1.6s infinite}.work .s2{animation:spk 1.6s .5s infinite}.work .s3{animation:spk 1.6s 1s infinite}
.star{animation:tw 2.2s ease-in-out infinite}.star.b{animation-delay:.7s}.star.c{animation-delay:1.4s}
.wait #cE,.wait #gE{transform:translateY(-3px)}.wait .bang{animation:pu 1.4s ease-in-out infinite}
.done #cB,.done #gB{animation:hop 2.4s ease-in-out infinite}
.bang,.chk,.hap{display:none}
.wait .bang,.done .chk,.done .hap{display:inline}
.done #cE,.done #gE,.wait .spk,.done .spk{display:none}
</style>

// ---------- แกลเลอรีภาพวาด: พิกเซลอาร์ต (1 พิกเซล = 2 หน่วยบนผ้าใบ) ----------
// ทั้ง 7 ภาพวาดด้วยโค้ดใน ~/Claude/Projects/claude-ambient/tools/cute-paint.js (ลายเส้นสะอาด สัดส่วนตามภาพจริง)
// แก้ภาพ: แก้ใน cute-paint.js แล้วรัน node cute-paint.js <ชื่อภาพ|all> --html <ไฟล์นี้>
// d = {w, h, pal: [สี], px: ตัวอักษรละ 1 พิกเซล อ้างลำดับใน pal}
var AREA = {p: [154, 28, 78, 88], l: [146, 56, 94, 60]};
var CH = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
function r(x, y, w, h, c) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + c + '"/>'; }
function easel(o) {
  var top = o === 'p' ? 30 : 48, wide = o === 'p' ? 0 : 6;
  return '<path d="M' + (166 - wide) + ' ' + top + ' L' + (150 - wide / 3) + ' 148 M' + (220 + wide) + ' ' + top + ' L' + (236 + wide / 3) + ' 148 M193 118 L193 148" stroke="#854F0B" stroke-width="5" fill="none"/>'
    + r(o === 'p' ? 146 : 138, 117, o === 'p' ? 94 : 110, 6, '#854F0B');
}
function frame(o) { var a = AREA[o]; return r(a[0] - 4, a[1] - 4, a[2] + 8, a[3] + 8, '#B4B2A9'); }
function cover(o, rows) {
  var a = AREA[o];
  return '<rect class="cover" style="animation-timing-function:steps(' + rows + ')" x="' + a[0] + '" y="' + a[1] + '" width="' + a[2] + '" height="' + a[3] + '" fill="#E8E6DC"/>';
}
/** วาดตารางพิกเซล รวมช่องสีเดียวกันที่ติดกันในแถวเป็นสี่เหลี่ยมเดียว */
function pix(o, d) {
  var a = AREA[o], u = a[2] / d.w, s = '';
  for (var y = 0; y < d.h; y++) {
    for (var x = 0; x < d.w;) {
      var c = d.px.charAt(y * d.w + x), x0 = x;
      while (x < d.w && d.px.charAt(y * d.w + x) === c) x++;
      // ซ้อนทับ 0.4 กันเส้นขอบบางระหว่างแถวตอนย่อขยายจอ
      s += r(a[0] + x0 * u, a[1] + y * u, (x - x0) * u + 0.4, u + 0.4, d.pal[CH.indexOf(c)]);
    }
  }
  return '<g shape-rendering="crispEdges">' + s + '</g>';
}
var P = {};

P.mona = {o: 'p', name: 'Mona Lisa', svg:

  + r(156, 62, 16, 4, '#7A6A45') + r(214, 58, 16, 4, '#7A6A45') + r(176, 36, 34, 46, '#2A211B') + r(170, 62, 46, 22, '#2A211B')
  + r(184, 40, 18, 24, '#D9B38C') + r(184, 40, 18, 4, '#C9A07A') + r(188, 49, 3, 2, '#3A2A1E') + r(196, 49, 3, 2, '#3A2A1E')
  + r(191, 54, 4, 3, '#C9A07A') + r(189, 59, 9, 1.5, '#8A5A40') + r(197, 58, 2, 1.5, '#8A5A40') + r(186, 64, 14, 9, '#C9A07A')
  + r(164, 73, 58, 43, '#3A2A1E') + r(186, 73, 14, 3, '#5A4430') + r(172, 100, 36, 9, '#D9B38C') + r(180, 104, 22, 3, '#C9A07A')};

P.starry = {o: 'p', name: 'The Starry Night', svg:
  r(154, 28, 78, 88, '#0C447C')
  + '<path d="M156 50 q10 -10 20 0 t20 0 t20 0 t16 -2" stroke="#85B7EB" stroke-width="3" fill="none"/>'
  + '<path d="M156 64 q12 -8 24 0 t24 0 t24 -1" stroke="#378ADD" stroke-width="3" fill="none"/>'
  + '<path d="M170 76 q10 -6 20 0 t20 0 t20 -2" stroke="#85B7EB" stroke-width="2" fill="none"/>'
  + '<circle cx="190" cy="56" r="6" fill="none" stroke="#B5D4F4" stroke-width="2"/>'
  + '<circle cx="218" cy="40" r="9" fill="none" stroke="#EF9F27" stroke-width="2"/><circle cx="218" cy="40" r="5.5" fill="#FAC775"/>'
  + '<circle class="star" cx="166" cy="38" r="2.5" fill="#FAC775"/><circle class="star b" cx="186" cy="36" r="2.5" fill="#FAC775"/>'
  + '<circle class="star c" cx="204" cy="66" r="2.5" fill="#FAC775"/><circle class="star b" cx="226" cy="70" r="2" fill="#FAC775"/>'
  + '<circle class="star" cx="172" cy="56" r="2" fill="#FAC775"/>'
  + '<path d="M154 100 Q176 88 196 96 T232 92 V116 H154 Z" fill="#042C53"/>' + r(198, 84, 3, 14, '#042C53')
  + r(188, 102, 5, 4, '#0C447C') + r(204, 100, 6, 5, '#0C447C') + r(214, 104, 5, 4, '#0C447C')
  + r(190, 103, 2, 2, '#FAC775') + r(206, 101, 2, 2, '#FAC775') + r(216, 105, 2, 2, '#FAC775')

P.supper = {o: 'l', name: 'The Last Supper', svg: (function () {
  var s = r(146, 56, 94, 60, '#5E5446') + r(146, 56, 94, 9, '#8A7E6A')
    + '<path d="M156 56 V65 M170 56 V65 M184 56 V65 M198 56 V65 M212 56 V65 M226 56 V65" stroke="#6B5E4E" stroke-width="1.5"/>'
    + '<path d="M146 65 L166 72 V96 L146 104 Z" fill="#4A3A2E"/><path d="M240 65 L220 72 V96 L240 104 Z" fill="#4A3A2E"/>'
    + r(149, 70, 4, 22, '#712B13') + r(157, 73, 4, 19, '#712B13') + r(233, 70, 4, 22, '#712B13') + r(225, 73, 4, 19, '#712B13')
    + r(166, 65, 54, 31, '#6B5E4E')
    + r(176, 71, 8, 11, '#B5D4F4') + r(188, 69, 10, 13, '#B5D4F4') + r(202, 71, 8, 11, '#B5D4F4')
    + r(176, 79, 8, 3, '#85B7EB') + r(188, 79, 10, 3, '#85B7EB') + r(202, 79, 8, 3, '#85B7EB');
  var xs = [149, 155, 161, 168, 174, 180, 200, 206, 212, 219, 225, 231];

// สถานที่ 8 ภาพ + ฟูจิแบบปกติ (วาดเองสไตล์ภาพวาดแบน)
function poly(pts, c) { return '<path d="M' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L') + ' Z" fill="' + c + '"/>'; }
function arch(x, y, w, h, c) { var rr = w / 2; return '<path d="M' + x + ' ' + (y + h) + ' V' + (y + rr) + ' A' + rr + ' ' + rr + ' 0 0 1 ' + (x + w) + ' ' + (y + rr) + ' V' + (y + h) + ' Z" fill="' + c + '"/>'; }
function rO(x, y, w, h, c, o) { return '<rect x="' + (+x).toFixed(1) + '" y="' + (+y).toFixed(1) + '" width="' + (+w).toFixed(1) + '" height="' + h + '" fill="' + c + '" opacity="' + o + '"/>'; }
function cloud(x, y, w) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="4" rx="2" fill="#F4F9FC"/><rect x="' + (x + w * .25) + '" y="' + (y - 2.6) + '" width="' + (w * .45) + '" height="4" rx="2" fill="#F4F9FC"/>'; }

  s += '<path d="M177 81.5 Q190 76 198 98" stroke="#DDF1FF" stroke-width="2" fill="none"/><path d="M177 82.5 Q189 79 196 98" stroke="#A9D6F5" stroke-width="1" fill="none"/>'
    + ell(197, 98, 3, 1, '#DDF1FF');
  return s;
})()};

// ---------- วนภาพ: วาดเสร็จ 1 ภาพ (8 วินาที) แล้วขึ้นผ้าใบใหม่ ----------
var POOL = ['mona', 'supper', 'wave', 'wat', 'starry', 'adam', 'pollock', 'pearl', 'scream', 'sunflowers', 'cafe', 'impression', 'jatte', 'kiss', 'wanderer', 'fuji', 'mondrian', 'eiffel', 'pisa', 'colosseum', 'venice', 'jungfrau', 'trevi', 'shanghai', 'merlion'];
var art = {sc: 0, sg: 4};   // Claude เริ่ม Mona Lisa, Local AI เริ่ม Starry Night (ห่างกัน 4 ภาพ ไม่ซ้ำกันพร้อมกัน)
function paint(id) {
  var p = P[POOL[art[id] % POOL.length]];
  if (!p.svg) p.svg = pix(p.o, p.d);
  document.querySelector('#' + id + ' .art').innerHTML = easel(p.o) + frame(p.o) + p.svg + cover(p.o, p.d ? p.d.h : 14);
}
function paintAll() { paint('sc'); paint('sg'); }
var cycle = null;
function restartCycle() {
  clearInterval(cycle);
  paintAll();
  cycle = setInterval(function () { art.sc++; art.sg++; paintAll(); }, 8000);
}
function setArt(c, l) { art.sc = c; art.sg = l; paintAll(); }   // ใช้ทดสอบ

// ---------- สถานะ: ส่งมาจากแอปผ่าน update({...}) ----------
var S = {state: 'work', agents: ['claude'], label: '', t0: Date.now(), frozen: null, doneUntil: 0};
var shownState = null;
var $ = function (i) { return document.getElementById(i); };
function fmt(s) {
  s = Math.max(0, Math.floor(s));
  var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
}
function title() {
  var c = S.agents.indexOf('claude') >= 0, l = S.agents.indexOf('local') >= 0;
  var who = c && l ? 'Claude และ Local AI' : (l ? 'Local AI' : 'Claude');
  if (S.state === 'wait') return who + ' รอคุณอนุมัติ';
  if (S.state === 'done') return 'เสร็จแล้ว';
  return l && !c ? 'Local AI กำลังสร้างภาพ' : who + ' กำลังทำงาน';
}
function render() {
  var now = Date.now();
  var el = S.frozen != null ? S.frozen : (now - S.t0) / 1000;
  var pre = S.label ? S.label + ' · ' : '';
  var onlyLocal = S.agents.length === 1 && S.agents[0] === 'local';
  var sub = S.state === 'wait' ? pre + 'รอมา ' + fmt(el)
          : S.state === 'done' ? pre + 'ใช้เวลา ' + fmt(el)
          : pre + fmt(el);
  var hint = S.state === 'wait' ? 'ขยับเมาส์เพื่อไปกดอนุญาต'
           : S.state === 'done' ? 'หน้าจอจะพักในอีก ' + Math.max(1, Math.ceil((S.doneUntil - now) / 60000)) + ' นาที'
           : (onlyLocal ? 'ทำงานในเครื่อง ไม่ใช้ token' : 'ขยับเมาส์เพื่อกลับไปที่งาน') + ' · เครื่องจะไม่หลับจนกว่างานเสร็จ';
  if (S.state !== shownState) {
    shownState = S.state;
    var cls = 'ch ' + S.state;
    $('sc').setAttribute('class', cls); $('sg').setAttribute('class', cls);
    if (S.state === 'work') restartCycle(); else { clearInterval(cycle); cycle = null; }
  }
  $('sc').style.display = S.agents.indexOf('claude') >= 0 || !S.agents.length ? '' : 'none';
  $('sg').style.display = S.agents.indexOf('local') >= 0 ? '' : 'none';
  $('t1').textContent = title();
  $('t2').textContent = sub;
  $('hint').textContent = hint;
  var d = new Date();
  $('clk').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

// ---------- เวลาจริง: กลางวัน / เช้า / เย็น / กลางคืน / ดึก ----------
var forcedHour = null;   // ใช้ทดสอบ: setHour(23)
function setHour(h) { forcedHour = h; applyTime(); }
function applyTime() {
  var h = forcedHour != null ? forcedHour : new Date().getHours();
  var mode = h >= 22 || h < 5 ? 'late' : h >= 19 ? 'night' : h >= 17 ? 'dusk' : h >= 9 ? 'day' : 'morning';
  // เปลี่ยนเฉพาะคลาสของฉาก ไม่ทับคลาสอื่น (recap, hot)
  ['morning', 'day', 'dusk', 'night', 'late'].forEach(function (m) { document.body.classList.toggle(m, m === mode); });
  $('sky').className = mode;
}
(function stars() {
  var sky = $('sky'), seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = 0; i < 46; i++) {
    var d = document.createElement('div');
    d.className = 'px';
    d.style.left = (rnd() * 100) + '%'; d.style.top = (rnd() * 55) + '%';
    d.style.animationDelay = (rnd() * 3.2) + 's';
    d.style.opacity = .25 + rnd() * .5;
    sky.appendChild(d);
  }
})();
var starCss = document.createElement('style');
starCss.textContent = '#sky .px{display:none}.night #sky .px,.late #sky .px{display:block}';
document.head.appendChild(starCss);


// ---------- โควตา Claude (แบตเตอรี่พิกเซล) ----------
var KIND = {edit: ['แก้', '#D97757'], bash: ['รัน', '#5DCAA5'], read: ['อ่าน', '#888780'], search: ['ค้นหา', '#85B7EB'],
            web: ['ค้นเว็บ', '#AFA9EC'], agent: ['ส่งงานให้ผู้ช่วย', '#FAC775'], tool: ['ใช้', '#B4B2A9']};
function hhmm(ms) { var d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function renderQuota() {
  var q = S.q, box = $('quota');
  if (!q) { box.innerHTML = ''; document.body.classList.remove('hot'); return; }
  var left = Math.max(0, 100 - q.u), col = q.u >= 85 ? '#E24B4A' : q.u >= 60 ? '#EF9F27' : '#5DCAA5', seg = Math.round(left / 10), cells = '';
  for (var i = 0; i < 10; i++) cells += '<rect x="' + (2 + i * 3) + '" y="2" width="2.4" height="6" fill="' + (i < seg ? col : '#2C2C2A') + '"/>';
  var bat = '<svg viewBox="0 0 36 10" shape-rendering="crispEdges"><rect x=".5" y=".5" width="32" height="9" fill="none" stroke="#5f5e5a"/><rect x="33" y="3" width="2.5" height="4" fill="#5f5e5a"/>' + cells + '</svg>';
  var line1 = '<b>เหลือ ' + left + '%</b>' + (q.r > Date.now() ? ' · รีเซ็ต ' + hhmm(q.r) : '') + (q.est ? ' · ประมาณ' : '');
  var line2 = q.w != null ? '<br>สัปดาห์นี้ใช้ไป ' + q.w + '%' : '';
  box.innerHTML = bat + '<div>' + line1 + line2 + '</div>';
  document.body.classList.toggle('hot', q.u >= 85);
}

// ---------- Claude กำลังทำอะไร (งานล่าสุด 3 อย่าง + ตัวนับ) ----------
var lastActKey = '';
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
function renderActs() {
  var acts = S.acts || [], n = S.n || {}, box = $('acts');
  if (S.state === 'wait' || (!acts.length && !Object.keys(n).length)) { box.innerHTML = ''; lastActKey = ''; return; }
  var key = JSON.stringify(acts[0] || []), html = '';
  if (S.state === 'work') {
    acts.forEach(function (a, i) {
      var k = KIND[a[0]] || KIND.tool;
      html += '<div class="act' + (i === 0 ? ' now' + (key !== lastActKey && lastActKey ? ' fresh' : '') : '') + '"><i style="background:' + k[1] + '"></i>' + k[0] + (a[1] ? ' ' + esc(a[1]) : '') + '</div>';
    });
  }
  // ตัวเลขคือจำนวนครั้ง (แก้ไฟล์เดิมซ้ำก็นับ)
  var order = [['edit', 'แก้ไฟล์'], ['bash', 'รันคำสั่ง'], ['read', 'อ่านไฟล์'], ['search', 'ค้นหา'], ['web', 'ค้นเว็บ'], ['agent', 'ส่งงาน']], parts = [];
  order.forEach(function (o) { if (n[o[0]]) parts.push(o[1] + ' ' + n[o[0]]); });
  if (parts.length) html += '<div id="cnt">' + (S.state === 'done' ? 'งานนี้: ' : '') + parts.join(' · ') + '</div>';
  box.innerHTML = html;
  lastActKey = key;
}

// ---------- การ์ดสรุปตอนกลับมาที่เครื่อง ----------
function awayText(sec) {
  var m = Math.max(1, Math.round(sec / 60)), h = Math.floor(m / 60);
  return h ? h + ' ชม.' + (m % 60 ? ' ' + (m % 60) + ' นาที' : '') : m + ' นาที';
}
function names(list) {
  var seen = {}, out = [];
  list.forEach(function (n) { if (n && !seen[n]) { seen[n] = 1; out.push(n); } });
  return esc(out.slice(0, 3).join(', ') + (out.length > 3 ? ' และอีก ' + (out.length - 3) : ''));
}
function recap(o) {
  var rows = '';
  if (o.done.length) rows += '<div class="rr"><i style="background:#5DCAA5"></i>เสร็จ ' + o.done.length + ' งาน<span>' + names(o.done) + '</span></div>';
  if (o.wait.length) rows += '<div class="rr"><i style="background:#EF9F27"></i>รออนุมัติ ' + o.wait.length + ' งาน<span>' + names(o.wait) + '</span></div>';
  if (o.work) rows += '<div class="rr"><i style="background:#D97757"></i>ยังทำงานอยู่ ' + o.work + ' งาน</div>';
  $('recap').innerHTML = '<h1>ระหว่างที่คุณไม่อยู่ ' + awayText(o.away) + '</h1>' + rows
    + '<div id="rfoot"><span><kbd>Enter</kbd>ไปที่งาน</span><span><kbd>Esc</kbd>ปิด</span></div><div id="rbar"></div>';
  document.body.classList.add('recap');
}
function update(o) { for (var k in o) S[k] = o[k]; if (!S.agents) S.agents = ['claude']; render(); renderQuota(); renderActs(); }
applyTime(); setInterval(applyTime, 60000);
paintAll();
setInterval(render, 1000);
render();
</script>
</body>
</html>
